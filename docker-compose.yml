services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gemini-clone-app
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXTAUTH_URL: http://localhost:3000
      MONGODB_URI: mongodb://mongo:27017/devgemini
    depends_on:
      - mongo
    ports:
      - "3000:3000"

  mongo:
    image: mongo:7
    container_name: gemini-clone-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
